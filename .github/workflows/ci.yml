name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install root dependencies
        run: bun install

      - name: Install example dependencies
        run: cd example && bun install

      - name: Typecheck (root)
        run: bunx tsc --noEmit

      - name: Typecheck (example)
        run: cd example && bunx tsc --noEmit

      - name: Lint (root)
        run: bunx eslint . --max-warnings=50
